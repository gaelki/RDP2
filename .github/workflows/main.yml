name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "        CONFIGURING REMOTE DESKTOP"
          Write-Host "=========================================="

          # Enable Remote Desktop
          reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f

          # Keep Network Level Authentication enabled
          reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 1 /f

          # Standard RDP security layer
          reg.exe add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 1 /f

          # Enable Windows Firewall rules for Remote Desktop
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Restart Remote Desktop service
          Restart-Service -Name "TermService" -Force

          Write-Host "RDP configuration completed successfully."


      - name: Create RDP User
        shell: pwsh
        run: |
          Write-Host "Creating RDP user..."

          $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

          $password = -join (
              1..20 | ForEach-Object {
                  $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
              }
          )

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove existing user if present
          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
              Remove-LocalUser -Name "RDP"
          }

          # Create user
          New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          # Add permissions
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Save credentials
          "RDP_USERNAME=RDP" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "RDP user created successfully."


      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "Installing Tailscale..."

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $installer

          Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList "/i `"$installer`" /quiet /norestart" `
              -Wait

          Remove-Item $installer -Force

          Write-Host "Tailscale installed successfully."


      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "Connecting to Tailscale..."

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          & $tailscale up `
              --authkey="$env:TAILSCALE_AUTH_KEY" `
              --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to connect to Tailscale."
              exit 1
          }

          Write-Host "Tailscale connected."

          # Wait for IPv4 address
          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              $tsIP = (& $tailscale ip -4 2>$null |
                  Select-Object -First 1).Trim()

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for Tailscale IP... attempt $i/20"
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale did not provide an IPv4 address."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Tailscale IPv4: $tsIP"


      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "           TESTING RDP CONNECTION"
          Write-Host "=========================================="

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Testing TCP port 3389..."

          $result = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP port 3389 is reachable."
          Write-Host "RDP is ready."


      - name: Display RDP Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "Port     : 3389"
          Write-Host "=========================================="
          Write-Host ""


      - name: Keep Runner Alive
        shell: pwsh
        run: |
          Write-Host "RDP session is active."
          Write-Host "Runner will remain active until the workflow is stopped."

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"
              Start-Sleep -Seconds 300
          }
