name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 1 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Restart-Service -Name TermService -Force

          Write-Host "RDP configured successfully."

      - name: Create RDP User
        shell: powershell
        run: |
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%'

          $password = -join (1..20 | ForEach-Object {
              $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)]
          })

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $existing = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existing) {
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser -Name "RDP" -Password $securePassword -AccountNeverExpires -PasswordNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_USERNAME=RDP" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "RDP user created."

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait

          Remove-Item $installer -Force

          Write-Host "Tailscale installed."

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale not found."
              exit 1
          }

          & $tailscale up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
              $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "No Tailscale IP received."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Testing $env:TAILSCALE_IP`:3389..."

          $result = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "Port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP is accessible."

      - name: Show RDP Credentials
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "IP       : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "Port     : 3389"
          Write-Host "=========================================="
          Write-Host ""

      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RDP is active."
              Start-Sleep -Seconds 300
          }
